---
- name: Monitor /opt/ directory for changes
  hosts: localhost
  sources:
    - ansible.eda.file_watch:
        paths:
          - /opt/
  rules:
##---------------------------Folder Monitor Starts----------------------------  
    - name: Monitoring complete folder for any changes in file !!!
      condition: event.type == "modified" or event.type == "created" or event.type == "deleted"
      action:
        run_job_template:
          name: Demo Job Template
          organization: Default
